name: RageTweaks

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish FortniteTweakTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FortniteTweakTool
          path: publish/*.exe
